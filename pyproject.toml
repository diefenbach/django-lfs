[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "django-lfs"
dynamic = ["version"]
description = "LFS - Lightning Fast Shop"
readme = "README.rst"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [{ name = "Kai Diefenbach" }]
keywords = ["django", "e-commerce", "online-shop"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12"
# Everything the core imports or loads in its templates. Optional add-ons (carousel, bulk prices,
# samples, ...) are not listed; the core uses them only when they are in INSTALLED_APPS.
dependencies = [
    "Django>=5.2,<6",
    "Pillow>=12,<13",
    "babel>=2.18,<3",
    "django-compressor>=4.6,<5",
    "django-crispy-forms>=2.7,<3",
    "crispy-bootstrap5>=2026.9,<2028",
    "django-simple-captcha>=0.7,<1",
    "django-portlets>=1.5,<2",
    "django-reviews>=1.2.1,<2",
    "django-postal>=0.96,<1",
    "lfs-contact>=1.3.1,<2",
    "lfs-order-numbers>=1.2,<2",
    "lfs-paypal>=1.4.1,<2",
]

[project.urls]
Source = "https://github.com/diefenbach/django-lfs"

[tool.setuptools.dynamic]
version = { attr = "lfs.__version__" }

[tool.setuptools.packages.find]
include = ["lfs*"]
