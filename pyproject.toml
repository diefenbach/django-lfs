[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "django-lfs"
dynamic = ["version"]
description = "LFS - Lightning Fast Shop"
readme = "README.rst"
# LFS itself is BSD; the management interface bundles TinyMCE (GPL-2.0-or-later), Bootstrap, Bootstrap Icons,
# flatpickr, SortableJS (MIT), and htmx (0BSD) under lfs/manage/static/lfs/manage/vendor/.
license = "BSD-3-Clause AND GPL-2.0-or-later AND MIT AND 0BSD"
license-files = ["LICENSE.txt", "lfs/manage/static/lfs/manage/vendor/tinymce/license.md"]
authors = [{ name = "Kai Diefenbach" }]
keywords = ["django", "e-commerce", "online-shop"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12"
# Everything the core imports or loads in its templates. Optional add-ons (carousel, bulk prices,
# samples, ...) are not listed; the core uses them only when they are in INSTALLED_APPS.
dependencies = [
    "Django>=5.2,<6",
    "Pillow>=12,<13",
    "babel>=2.18,<3",
    "django-compressor>=4.6,<5",
    "django-crispy-forms>=2.7,<3",
    "crispy-bootstrap5>=2026.9,<2028",
    "django-simple-captcha>=0.7,<1",
    # In LFS_APPS: LFS needs them itself, not only through lfs-postal.
    "django-countries>=9.1,<10",
    "django-localflavor>=5.1,<6",
    "django-portlets>=2.0,<3",
    "django-reviews>=2.0,<3",
    "lfs-postal>=1.0,<2",
    "lfs-contact>=2.0,<3",
    "lfs-order-numbers>=2.0,<3",
]

[project.urls]
Source = "https://github.com/diefenbach/django-lfs"

[tool.setuptools.dynamic]
version = { attr = "lfs.__version__" }

[tool.setuptools.packages.find]
include = ["lfs*"]
